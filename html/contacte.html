<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Activitat1</title>
        <meta name="description" content="Marc Reus">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link rel="stylesheet" href="/css/style.css">
        <link rel="stylesheet" href="/css/colors.css">
    </head>
    <body>
<header>
        <h1>Posa't en contacte amb mi</h1>
    </header>

    <main>
        <form action="#" method="post">
            
            <div>
                <label for="nom">Nom complet:</label><br>
                <input 
                    type="text" 
                    id="nom" 
                    name="nom" 
                    placeholder="Ex: Anna Garcia" 
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">Correu electrònic:</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Ex: anna.garcia@email.com" 
                    required
                >
            </div>

            <br>

            <div>
                <label for="missatge">El teu missatge:</label><br>
                <textarea 
                    id="missatge" 
                    name="missatge" 
                    rows="6" 
                    cols="40" 
                    placeholder="Escriu el teu missatge o consulta aquí..." 
                    required></textarea>
            </div>

            <br>

            <div>
                <button type="submit"> Enviar missatge</button>
            </div>

        </form>
    </main>
    </body>
</html>
